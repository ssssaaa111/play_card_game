name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rules:
    name: Rules and simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run all tests
        run: npm test
      - name: Run deterministic rule simulation
        run: npm run sim:ci
      - name: Run finale full-duel regression
        run: npm run sim:finale

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run browser regression scenarios
        shell: bash
        run: |
          node scripts/dev-server.mjs > server.out.log 2> server.err.log &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5177/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          npm run smoke:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-failure-${{ github.run_attempt }}
          path: |
            .tmp/browser-smoke-failures/
            server.out.log
            server.err.log
          if-no-files-found: warn
          retention-days: 14

  online-smoke:
    name: Online duel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run two-client online duel smoke
        shell: bash
        run: |
          node scripts/duel-server.mjs --scenario=trap-response > duel-server.out.log 2> duel-server.err.log &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5178/health > /dev/null; then
              break
            fi
            sleep 0.25
          done
          npm run smoke:online -- --scenario=trap-response
          npm run smoke:online -- --custom-decks
          npm run smoke:online-restart -- --spectator --network

  online-browser-smoke:
    name: Online duel browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run three-browser online duel lifecycle regression
        shell: bash
        env:
          DUEL_AUTH_STORE: ${{ runner.temp }}/card-duel-online-browser-auth.json
          DUEL_ROOM_STORE: ${{ runner.temp }}/card-duel-online-browser-rooms.json
          DUEL_TURN_TIMEOUT_MS: 300000
          DUEL_AUTH_ATTEMPT_LIMIT: 50
        run: |
          set -euo pipefail
          browser_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser_bin" ]]; then
            echo "No Chromium-compatible browser is installed on the runner." >&2
            exit 1
          fi
          export BROWSER_BIN="$browser_bin"

          node scripts/dev-server.mjs --port=5177 > online-browser-frontend.out.log 2> online-browser-frontend.err.log &
          frontend_pid=$!
          node scripts/duel-server.mjs --port=5178 --scenario=trap-response > online-browser-duel.out.log 2> online-browser-duel.err.log &
          duel_pid=$!
          node scripts/duel-latency-proxy.mjs --port=5182 --target=ws://127.0.0.1:5178/duel --delay-ms=4000 > online-browser-latency.out.log 2> online-browser-latency.err.log &
          latency_pid=$!
          node scripts/duel-latency-proxy.mjs --port=5184 --target=ws://127.0.0.1:5178/duel --delay-ms=0 --drop-response-ack > online-browser-ack-loss.out.log 2> online-browser-ack-loss.err.log &
          ack_loss_pid=$!
          node scripts/duel-latency-proxy.mjs --port=5185 --target=ws://127.0.0.1:5178/duel --delay-ms=0 --drop-response-request > online-browser-request-loss.out.log 2> online-browser-request-loss.err.log &
          request_loss_pid=$!
          DUEL_AUTH_STORE="$RUNNER_TEMP/card-duel-effect-auth.json" \
            DUEL_ROOM_STORE="$RUNNER_TEMP/card-duel-effect-rooms.json" \
            node scripts/duel-server.mjs --port=5179 --scenario=effect-choice > online-browser-effects.out.log 2> online-browser-effects.err.log &
          effect_pid=$!
          DUEL_AUTH_STORE="$RUNNER_TEMP/card-duel-tribute-auth.json" \
            DUEL_ROOM_STORE="$RUNNER_TEMP/card-duel-tribute-rooms.json" \
            node scripts/duel-server.mjs --port=5180 --scenario=tribute-choice > online-browser-tributes.out.log 2> online-browser-tributes.err.log &
          tribute_pid=$!
          DUEL_AUTH_STORE="$RUNNER_TEMP/card-duel-chain-auth.json" \
            DUEL_ROOM_STORE="$RUNNER_TEMP/card-duel-chain-rooms.json" \
            node scripts/duel-server.mjs --port=5181 --scenario=multi-chain-response > online-browser-chain.out.log 2> online-browser-chain.err.log &
          chain_pid=$!
          DUEL_AUTH_STORE="$RUNNER_TEMP/card-duel-expiry-auth.json" \
            DUEL_ROOM_STORE="$RUNNER_TEMP/card-duel-expiry-rooms.json" \
            DUEL_TURN_TIMEOUT_MS=10000 \
            node scripts/duel-server.mjs --port=5183 --scenario=trap-response > online-browser-expiry.out.log 2> online-browser-expiry.err.log &
          expiry_pid=$!
          cleanup() {
            kill "$frontend_pid" "$duel_pid" "$effect_pid" "$tribute_pid" "$chain_pid" "$latency_pid" "$expiry_pid" "$ack_loss_pid" "$request_loss_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:5177/online.html > /dev/null \
              && curl --fail --silent http://127.0.0.1:5178/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:5182/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:5184/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:5185/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:5179/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:5180/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:5181/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:5183/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "Online browser smoke services did not become ready." >&2
            cat online-browser-*.err.log >&2 || true
            exit 1
          fi

          npm run smoke:online-browser -- \
            --pending-feedback \
            --frontend-url http://127.0.0.1:5177 \
            --duel-server-url http://127.0.0.1:5182 \
            --timeout-ms 45000
          npm run smoke:online-browser -- \
            --response-ack-loss \
            --frontend-url http://127.0.0.1:5177 \
            --duel-server-url http://127.0.0.1:5184 \
            --artifact-dir .tmp/online-browser-smoke/ack-loss \
            --timeout-ms 45000
          npm run smoke:online-browser -- \
            --response-request-loss \
            --frontend-url http://127.0.0.1:5177 \
            --duel-server-url http://127.0.0.1:5185 \
            --artifact-dir .tmp/online-browser-smoke/request-loss \
            --timeout-ms 45000
          npm run smoke:online-browser -- \
            --effect-choices \
            --frontend-url http://127.0.0.1:5177 \
            --duel-server-url http://127.0.0.1:5179 \
            --artifact-dir .tmp/online-browser-smoke/effects \
            --timeout-ms 45000
          npm run smoke:online-browser -- \
            --tribute-choices \
            --frontend-url http://127.0.0.1:5177 \
            --duel-server-url http://127.0.0.1:5180 \
            --artifact-dir .tmp/online-browser-smoke/tributes \
            --timeout-ms 45000
          npm run smoke:online-browser -- \
            --chain-rhythm \
            --frontend-url http://127.0.0.1:5177 \
            --duel-server-url http://127.0.0.1:5181 \
            --artifact-dir .tmp/online-browser-smoke/chains \
            --timeout-ms 45000
          npm run smoke:online-browser -- \
            --selection-expiry \
            --frontend-url http://127.0.0.1:5177 \
            --duel-server-url http://127.0.0.1:5183 \
            --artifact-dir .tmp/online-browser-smoke/expiry \
            --timeout-ms 45000
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: online-browser-smoke-${{ github.run_attempt }}
          path: |
            .tmp/online-browser-smoke/
            online-browser-frontend.out.log
            online-browser-frontend.err.log
            online-browser-duel.out.log
            online-browser-duel.err.log
            online-browser-latency.out.log
            online-browser-latency.err.log
            online-browser-ack-loss.out.log
            online-browser-ack-loss.err.log
            online-browser-request-loss.out.log
            online-browser-request-loss.err.log
            online-browser-effects.out.log
            online-browser-effects.err.log
            online-browser-tributes.out.log
            online-browser-tributes.err.log
            online-browser-chain.out.log
            online-browser-chain.err.log
            online-browser-expiry.out.log
            online-browser-expiry.err.log
          if-no-files-found: warn
          retention-days: 14
