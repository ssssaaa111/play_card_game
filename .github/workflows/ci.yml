name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rules:
    name: Rules and simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Run all tests
        run: npm test
      - name: Run deterministic rule simulation
        run: npm run sim:ci
      - name: Run finale full-duel regression
        run: npm run sim:finale

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Run browser regression scenarios
        shell: bash
        run: |
          node scripts/dev-server.mjs > server.out.log 2> server.err.log &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5177/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          npm run smoke:browser
